---
name: "Simple Github Actions Workflow Script"

on:
  push:
    branches:
      - master

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: "Running date command"
        run: date

      - name: "Getting OS details"
        run: cat /etc/os-release

      - name: "Current working directory and its contents before packer installation"
        run: |
          pwd
          ls -l

      - name: "Installing packer"
        run: |
          wget https://releases.hashicorp.com/packer/1.15.1/packer_1.15.1_linux_amd64.zip
          unzip packer_1.15.1_linux_amd64.zip

      - name: "Current working directory and its contents after packer installation"
        run: |
          pwd
          ls -l
